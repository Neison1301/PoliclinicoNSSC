# ... (Se mantiene todo lo que enviaste arriba)
# jobs:
#   build:
# ...
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    # 1. MODIFICACIÓN: AGREGAR EL PASO DE SUBIR EL ARTEFACTO (JAR/WAR)
    - name: Subir el Artefacto (JAR/WAR)
      uses: actions/upload-artifact@v4
      with:
        name: policlinico-app # Nombre del artefacto
        path: target/*.jar # RUTA del archivo generado (ajusta a .war si es necesario)

    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

# 2. MODIFICACIÓN: AGREGAR LOS JOBS DE DESPLIEGUE (CD)

  deploy_staging:
    name: Deploy a Staging
    needs: [build] # Cambia 'build_and_test' a 'build' si mantienes ese nombre de job
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Descargar Artefacto
        uses: actions/download-artifact@v4
        with:
          name: policlinico-app
          
      - name: Desplegar a Servidor de Staging (SSH Ejemplo)
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Usa los Secrets que configuraste en GitHub
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            echo "Despliegue a Staging..."
            mv policlinico-app.jar /var/www/policlinico/
            # Comando de reinicio de servicio
            sudo systemctl restart policlinico-app.service
            
  deploy_production:
    name: Deploy a Production
    needs: [deploy_staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      # url: https://tudominio.com
    
    steps:
      - name: Descargar Artefacto
        uses: actions/download-artifact@v4
        with:
          name: policlinico-app
          
      - name: Desplegar a Servidor de Producción (SSH Ejemplo)
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Usa los Secrets de Producción
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo "Despliegue a Producción..."
            mv policlinico-app.jar /var/www/policlinico/
            # Comando de reinicio de servicio
            sudo systemctl restart policlinico-app.service
