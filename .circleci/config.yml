version: 2.1
jobs:
  # Job 1: Construcción y Prueba (CI)
  build:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      
      # 1. Ejecutar Build y Pruebas
      - run:
          name: Build, Test and Package (CI)
          command: mvn -B -DskipTests=false package 
          
      # 2. Persistir el Artefacto (el archivo .jar o .war)
      # Esto guarda el archivo generado para que el Job 'deploy' pueda usarlo.
      - persist_to_workspace:
          root: target
          paths:
            - "*.jar" # Ajusta a "*.war" si es necesario
            
  # Job 2: Despliegue a Staging (CD)
  deploy:
    docker:
      # Usamos una imagen base ligera para el despliegue
      - image: cimg/base:2023.11
    steps:
      # 1. Adjuntar el Artefacto del Job 'build'
      - attach_workspace:
          at: target
          
      # 2. Desplegar mediante SSH
      # Asegúrate de haber configurado el 'ssh-key' en las variables de CircleCI
      - run:
          name: Deploy to Staging (CD)
          command: |
            # Instala la herramienta para la conexión SSH (si no está disponible)
            sudo apt-get update && sudo apt-get install openssh-client -y
            
            # Comando de despliegue usando scp para transferir el JAR
            # Reemplaza USER, HOST y RUTA_REMOTO con tus datos
            scp target/*.jar USER@HOST:RUTA_REMOTO/policlinico-app.jar
            
            # Comando para reiniciar el servicio remoto (ej. con SSH)
            ssh USER@HOST "sudo systemctl restart policlinico-app.service"

# Workflow: Define la secuencia de CI -> CD
workflows:
  version: 2
  ci_cd_full: # Nuevo nombre para el workflow
    jobs:
      - build # Ejecuta el Job de CI primero
      - deploy: # Ejecuta el Job de CD después
          requires:
            - build # El despliegue requiere que la construcción haya sido exitosa