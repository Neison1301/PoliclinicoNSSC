# ============================================
# Configuración para Entorno Docker
# ============================================

spring.application.name=policlinicoSC

# ----------------
# Servidor
# ----------------
server.port=8080

# ----------------
# Base de Datos (Variables de entorno)
# ----------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-db:3306/policlinicosagrado?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:policlinico_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:policlinico_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------
# JPA/Hibernate
# ----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ----------------
# Logging
# ----------------
logging.level.org.thymeleaf=INFO
logging.level.org.springframework.web=INFO
logging.level.com.webapplication=DEBUG

# ----------------
# Email
# ----------------
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST:smtp.gmail.com}

# ----------------
# Actuator (Health Checks)
# ----------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
